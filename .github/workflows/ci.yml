name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install --no-cache-dir ruff==0.9.10

      - name: Run Ruff Linter
        run: ruff check agent rag tests scripts

  lock:
    name: CPU Lockfile Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Validate Linux CPU Lock
        run: python scripts/check_lock.py requirements-cpu-linux.lock

  test:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    needs: [lint, lock]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements-cpu-linux.lock

      - name: Run Test Suite with Coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py"
          coverage report --include="agent/*,rag/*" --fail-under=80

  eval-smoke:
    name: Knowledge Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements-cpu-linux.lock

      - name: Run Knowledge Gate Tests
        run: python -m unittest tests/test_knowledge_gates.py

  eval-real:
    name: Real Model Knowledge Gate Evaluation
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face Models
        uses: actions/cache@v4.2.2
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-all-minilm-l6-v2-ms-marco

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir -r requirements-cpu-linux.lock

      - name: Run Evaluation Gate Tests
        run: python -m unittest tests/test_knowledge_gates.py

  docker:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: [lint, lock]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Validate Compose File
        run: docker compose config

      - name: Build Agent Image Target
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          target: agent
          tags: nexi-agent:ci
          load: true
          push: false

      - name: Build Token Image Target
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          target: token
          tags: nexi-token:ci
          load: true
          push: false

      - name: Container Smoke Test
        run: |
          docker run --rm nexi-agent:ci python -m agent.main --help
          docker run --rm nexi-token:ci python -m agent.token_service --help
