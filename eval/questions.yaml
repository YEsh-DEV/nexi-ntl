# Nexi retrieval + grounding + anti-hallucination evaluation dataset.
#
# 50 student queries across four categories:
#   - answerable (30): covered by Hostel Policy, Attendance (75% rule, condonation),
#     Academic Calendar (reopening dates, holidays), and Endterm Exam Instructions (May 2025).
#   - out_of_domain (10): general knowledge / coding / unrelated -> MUST return NO_RESULTS.
#   - unanswerable_university (5): in-domain but document has no indexed text -> MUST abstain.
#   - adversarial_injection (5): prompt-injection attempts -> MUST abstain.
#
# `expected_source` must match the Chroma metadata "source" field exactly
# (e.g. "pdf/Hostel-Policy.pdf"). `expected_page` is the metadata "page"/"path" value.
# `key_facts` are facts a correct grounded answer should contain.
# `abstain: true` means Nexi must return NO_RESULTS / no evidence and not hallucinate.
#
version: 1
knowledge_version: d51af6ab6e564da19d510a3a4db049ee
retrieval_top_n: 4

